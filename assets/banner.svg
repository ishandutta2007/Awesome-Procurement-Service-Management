<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 14px;
        fill: #38bdf8;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }

      /* Dynamic Animations */
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes particleMove {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateX(500px); opacity: 0; }
      }

      .animated-orb-1 {
        animation: pulseOrb 8s ease-in-out infinite alternate;
        transform-origin: 300px 150px;
      }
      .animated-orb-2 {
        animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
        transform-origin: 900px 250px;
      }
      .flow-path {
        stroke-dasharray: 8, 8;
        animation: flowDash 4s linear infinite;
      }
      .card-float-1 {
        animation: floatSlow1 5s ease-in-out infinite;
      }
      .card-float-2 {
        animation: floatSlow2 6s ease-in-out infinite;
      }
      .card-float-3 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Atmospheric Orbs (Behind All Content) -->
  <g filter="url(#glow)">
    <circle class="animated-orb-1" cx="250" cy="140" r="160" fill="#6366f1" opacity="0.3" />
    <circle class="animated-orb-2" cx="950" cy="240" r="180" fill="#38bdf8" opacity="0.25" />
    <circle class="animated-orb-1" cx="600" cy="380" r="140" fill="#a855f7" opacity="0.2" />
  </g>

  <!-- High-tech Grid Background Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Animated Workflow Line (Intake-to-Pay Pipeline) -->
  <g opacity="0.5" transform="translate(100, 360)">
    <line x1="50" y1="0" x2="950" y2="0" stroke="#334155" stroke-width="3" />
    <line class="flow-path" x1="50" y1="0" x2="950" y2="0" stroke="url(#primaryGlow)" stroke-width="3" />

    <!-- Pipeline Nodes -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="6" fill="#38bdf8" />
      <text x="0" y="20" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">Intake</text>
    </g>
    <g transform="translate(275, 0)">
      <circle cx="0" cy="0" r="6" fill="#6366f1" />
      <text x="0" y="20" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">Approval</text>
    </g>
    <g transform="translate(500, 0)">
      <circle cx="0" cy="0" r="6" fill="#a855f7" />
      <text x="0" y="20" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">PO Creation</text>
    </g>
    <g transform="translate(725, 0)">
      <circle cx="0" cy="0" r="6" fill="#ec4899" />
      <text x="0" y="20" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">3-Way Match</text>
    </g>
    <g transform="translate(950, 0)">
      <circle cx="0" cy="0" r="6" fill="#10b981" />
      <text x="0" y="20" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">Payment</text>
    </g>
  </g>

  <!-- Floating Dynamic Feature Pills (Arranged on Left, Right & Top) -->
  <g class="card-float-1" transform="translate(70, 75)">
    <rect width="175" height="36" rx="18" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#dropShadow)" />
    <text x="87" y="23" text-anchor="middle" class="pill-text">🚀 Intake-to-Pay (I2P)</text>
  </g>

  <g class="card-float-2" transform="translate(955, 75)">
    <rect width="175" height="36" rx="18" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" filter="url(#dropShadow)" />
    <text x="87" y="23" text-anchor="middle" class="pill-text">🤖 Guided Buying AI</text>
  </g>

  <g class="card-float-3" transform="translate(60, 260)">
    <rect width="185" height="36" rx="18" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" filter="url(#dropShadow)" />
    <text x="92" y="23" text-anchor="middle" class="pill-text">📊 Spend Orchestration</text>
  </g>

  <g class="card-float-2" transform="translate(955, 260)">
    <rect width="185" height="36" rx="18" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" filter="url(#dropShadow)" />
    <text x="92" y="23" text-anchor="middle" class="pill-text">⚡ Open-Source P2P</text>
  </g>

  <!-- Foreground Main Content (Central Focus, Completely Clear & Legible) -->
  <g transform="translate(600, 140)" filter="url(#dropShadow)">
    <!-- Top Category Tagline -->
    <text x="0" y="0" text-anchor="middle" class="tagline-text">Enterprise Procure-to-Pay &amp; Help Desk Ecosystem</text>

    <!-- Main Title with Gradient Stroke Accent -->
    <text x="0" y="52" text-anchor="middle" class="title-text">Awesome Procurement Service Management</text>

    <!-- Glowing Accent Underline -->
    <rect x="-240" y="72" width="480" height="4" rx="2" fill="url(#primaryGlow)" />

    <!-- Subtitle -->
    <text x="0" y="110" text-anchor="middle" class="subtitle-text">Curated SaaS Platforms, Intake Workflows &amp; Sovereign Open-Source Projects</text>

    <!-- Small Pill Summary Badges -->
    <g transform="translate(-180, 135)">
      <rect x="0" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="52" y="17" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">SaaS Suites</text>

      <rect x="120" y="0" width="115" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="177" y="17" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Self-Hosted</text>

      <rect x="250" y="0" width="115" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="307" y="17" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">AI Agents</text>
    </g>
  </g>
</svg>
